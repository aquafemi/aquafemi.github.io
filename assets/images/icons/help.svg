<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Outer circle with XP blue gradient -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5BA8FF"/>
      <stop offset="100%" stop-color="#0050C8"/>
    </radialGradient>
    <radialGradient id="shine" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="22" fill="url(#bg)" stroke="#0038A0" stroke-width="1"/>
  <circle cx="24" cy="24" r="22" fill="url(#shine)"/>
  <!-- Question mark -->
  <text x="24" y="33" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">?</text>
</svg>
